<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(
        title=${pageTitle},
        content=~{::main})}"
      xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<main>
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item">
                <a th:href="@{/degree-programs}">Degree Programs</a>
            </li>
            <li class="breadcrumb-item active" th:text="${pageTitle}">Form</li>
        </ol>
    </nav>

    <h2 th:text="${pageTitle}" class="mb-4">Form</h2>

    <div class="row">
        <div class="col-md-6">
            <form th:action="${formAction}" th:object="${degreeProgram}" method="post">
                <!-- Name -->
                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold">Name *</label>
                    <input type="text" id="name" th:field="*{name}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                           placeholder="e.g. BSc Computer Science"/>
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>

                <!-- Description -->
                <div class="mb-3">
                    <label for="description" class="form-label fw-semibold">Description</label>
                    <textarea id="description" th:field="*{description}"
                              class="form-control" rows="3"
                              placeholder="Optional description of the degree program"></textarea>
                </div>

                <!-- Max duration -->
                <div class="mb-4">
                    <label for="maxDurationInSemesters" class="form-label fw-semibold">
                        Max. Duration (semesters) *
                    </label>
                    <input type="number" id="maxDurationInSemesters"
                           th:field="*{maxDurationInSemesters}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('maxDurationInSemesters')} ? 'is-invalid'"
                           min="1" max="20"/>
                    <div class="invalid-feedback" th:errors="*{maxDurationInSemesters}"></div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-save me-1"></i>Save
                    </button>
                    <a th:href="@{/degree-programs}" class="btn btn-outline-secondary">
                        <i class="bi bi-x-circle me-1"></i>Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>
</body>
</html>
