<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(
        title='Degree Programs',
        content=~{::main})}"
      xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<main>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-mortarboard me-2"></i>Degree Programs</h2>
        <a th:href="@{/degree-programs/new}" class="btn btn-primary">
            <i class="bi bi-plus-circle me-1"></i>New Program
        </a>
    </div>

    <div th:if="${degreePrograms.isEmpty()}" class="text-center py-5 text-muted">
        <i class="bi bi-inbox display-4 d-block mb-3"></i>
        No degree programs yet.
        <a th:href="@{/degree-programs/new}">Create the first one.</a>
    </div>

    <div th:unless="${degreePrograms.isEmpty()}" class="row g-3">
        <div class="col-md-6 col-lg-4" th:each="program : ${degreePrograms}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${program.name}">Program Name</h5>
                    <p class="card-text text-muted small"
                       th:text="${program.description ?: 'No description.'}">Description</p>
                    <p class="card-text">
                        <small class="text-muted">
                            <i class="bi bi-calendar3 me-1"></i>
                            Max.
                            <span th:text="${program.maxDurationInSemesters}">6</span>
                            semesters
                        </small>
                    </p>
                </div>
                <div class="card-footer bg-transparent d-flex gap-2">
                    <a th:href="@{/degree-programs/{degreeProgramId}(degreeProgramId=${program.degreeProgramId})}"
                       class="btn btn-sm btn-outline-primary">
                        <i class="bi bi-eye me-1"></i>Details
                    </a>
                    <a th:href="@{/degree-programs/{degreeProgramId}/edit(degreeProgramId=${program.degreeProgramId})}"
                       class="btn btn-sm btn-outline-secondary">
                        <i class="bi bi-pencil me-1"></i>Edit
                    </a>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
