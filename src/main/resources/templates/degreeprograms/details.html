<!DOCTYPE html>
<html th:replace="~{fragments/layout :: layout(
        title=${degreeProgram.name},
        content=~{::main})}"
      xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<main>
    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item">
                <a th:href="@{/degree-programs}">Degree Programs</a>
            </li>
            <li class="breadcrumb-item active" th:text="${degreeProgram.name}">Program</li>
        </ol>
    </nav>

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-start mb-4">
        <div>
            <h2 th:text="${degreeProgram.name}" class="mb-1">Program Name</h2>
            <p class="text-muted mb-0"
               th:text="${degreeProgram.description ?: 'No description.'}">Description</p>
            <small class="text-muted">
                <i class="bi bi-calendar3 me-1"></i>Max.
                <span th:text="${degreeProgram.maxDurationInSemesters}">6</span> semesters
            </small>
        </div>
        <div class="d-flex gap-2">
            <a th:href="@{/degree-programs/{id}/edit(id=${degreeProgram.id})}"
               class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-pencil me-1"></i>Edit
            </a>
            <form th:action="@{/degree-programs/{id}/delete(id=${degreeProgram.id})}"
                  method="post"
                  onsubmit="return confirm('Delete this degree program and all its study modules?')">
                <button type="submit" class="btn btn-outline-danger btn-sm">
                    <i class="bi bi-trash me-1"></i>Delete
                </button>
            </form>
        </div>
    </div>

    <!-- Study Modules section -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0"><i class="bi bi-book me-2"></i>Study Modules</h4>
        <div class="d-flex gap-2">
            <a th:href="@{/degree-programs/{id}/study-modules/new(id=${degreeProgram.id})}"
               class="btn btn-primary btn-sm">
                <i class="bi bi-plus-circle me-1"></i>Add Study Module
            </a>
            <form th:action="@{/degree-programs/{id}/schedule/calculate(id=${degreeProgram.id})}"
                  method="post">
                <button type="submit" class="btn btn-success btn-sm"
                        th:disabled="${studyModules.isEmpty()}">
                    <i class="bi bi-calculator me-1"></i>Calculate Study Plan
                </button>
            </form>
            <a th:href="@{/degree-programs/{id}/schedule(id=${degreeProgram.id})}"
               class="btn btn-outline-success btn-sm">
                <i class="bi bi-calendar-check me-1"></i>View Plan
            </a>
        </div>
    </div>

    <!-- Filter bar -->
    <form th:action="@{/degree-programs/{id}(id=${degreeProgram.id})}" method="get"
          class="row g-2 align-items-end mb-3">
        <input type="hidden" name="sortBy"  th:value="${sortBy}"/>
        <input type="hidden" name="sortDir" th:value="${sortDir}"/>
        <div class="col-auto">
            <label for="nameFilter" class="form-label mb-1 small fw-semibold">Name</label>
            <input type="text" id="nameFilter" name="nameFilter"
                   class="form-control form-control-sm"
                   placeholder="Filter by name…"
                   th:value="${nameFilter}"/>
        </div>
        <div class="col-auto">
            <label for="offeredAt" class="form-label mb-1 small fw-semibold">Offered at</label>
            <input type="date" id="offeredAt" name="offeredAt"
                   class="form-control form-control-sm"
                   th:value="${#temporals.format(offeredAt, 'yyyy-MM-dd')}"/>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-primary btn-sm">
                <i class="bi bi-funnel me-1"></i>Apply
            </button>
            <a th:href="@{/degree-programs/{id}(id=${degreeProgram.id})}"
               class="btn btn-outline-secondary btn-sm ms-1">
                <i class="bi bi-x-circle me-1"></i>Reset
            </a>
        </div>
    </form>

    <div th:if="${studyModules.isEmpty()}" class="text-center py-4 text-muted border rounded">
        <i class="bi bi-inbox d-block mb-2"></i>
        No study modules found.
        <a th:href="@{/degree-programs/{id}/study-modules/new(id=${degreeProgram.id})}">
            Add the first study module.
        </a>
    </div>

    <table th:unless="${studyModules.isEmpty()}" class="table table-hover align-middle">
        <thead class="table-light">
        <tr>
            <th>
                <a class="text-decoration-none text-dark"
                   th:href="@{/degree-programs/{id}(id=${degreeProgram.id},nameFilter=${nameFilter},offeredAt=${#temporals.format(offeredAt,'yyyy-MM-dd')},sortBy='NAME',sortDir=${sortBy == 'NAME' and sortDir == 'ASC' ? 'DESC' : 'ASC'})}"
                >Name
                    <i th:class="${sortBy == 'NAME'} ? (${sortDir == 'ASC'} ? 'bi bi-arrow-up' : 'bi bi-arrow-down') : 'bi bi-arrow-down-up text-muted'"></i>
                </a>
            </th>
            <th>
                <a class="text-decoration-none text-dark"
                   th:href="@{/degree-programs/{id}(id=${degreeProgram.id},nameFilter=${nameFilter},offeredAt=${#temporals.format(offeredAt,'yyyy-MM-dd')},sortBy='OFFERED_FROM',sortDir=${sortBy == 'OFFERED_FROM' and sortDir == 'ASC' ? 'DESC' : 'ASC'})}"
                >Offered From
                    <i th:class="${sortBy == 'OFFERED_FROM'} ? (${sortDir == 'ASC'} ? 'bi bi-arrow-up' : 'bi bi-arrow-down') : 'bi bi-arrow-down-up text-muted'"></i>
                </a>
            </th>
            <th>
                <a class="text-decoration-none text-dark"
                   th:href="@{/degree-programs/{id}(id=${degreeProgram.id},nameFilter=${nameFilter},offeredAt=${#temporals.format(offeredAt,'yyyy-MM-dd')},sortBy='OFFERED_TO',sortDir=${sortBy == 'OFFERED_TO' and sortDir == 'ASC' ? 'DESC' : 'ASC'})}"
                >Offered To
                    <i th:class="${sortBy == 'OFFERED_TO'} ? (${sortDir == 'ASC'} ? 'bi bi-arrow-up' : 'bi bi-arrow-down') : 'bi bi-arrow-down-up text-muted'"></i>
                </a>
            </th>
            <th>
                <a class="text-decoration-none text-dark"
                   th:href="@{/degree-programs/{id}(id=${degreeProgram.id},nameFilter=${nameFilter},offeredAt=${#temporals.format(offeredAt,'yyyy-MM-dd')},sortBy='ECTS',sortDir=${sortBy == 'ECTS' and sortDir == 'ASC' ? 'DESC' : 'ASC'})}"
                >ECTS
                    <i th:class="${sortBy == 'ECTS'} ? (${sortDir == 'ASC'} ? 'bi bi-arrow-up' : 'bi bi-arrow-down') : 'bi bi-arrow-down-up text-muted'"></i>
                </a>
            </th>
            <th>Prerequisites</th>
            <th class="text-end">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="studyModule : ${studyModules}">
            <td>
                <a th:href="@{/degree-programs/{pid}/study-modules/{mid}(pid=${degreeProgram.id},mid=${studyModule.studyModuleKey})}"
                   class="fw-semibold text-decoration-none"
                   th:text="${studyModule.name}">Study Module</a>
            </td>
            <td th:text="${studyModule.offeredFrom != null ? #temporals.format(studyModule.offeredFrom, 'dd.MM.yyyy') : '—'}">
                —
            </td>
            <td th:text="${studyModule.offeredTo != null ? #temporals.format(studyModule.offeredTo, 'dd.MM.yyyy') : '—'}">
                —
            </td>
            <td th:text="${studyModule.ects}">3</td>
            <td>
                <span th:if="${!studyModule.hasPrerequisites}" class="text-muted small">—</span>
                <span th:unless="${!studyModule.hasPrerequisites}"
                      class="badge bg-secondary"
                      th:text="${studyModule.prerequisiteCount} + ' prerequisite(s)'">
                </span>
            </td>
            <td class="text-end">
                <a th:href="@{/degree-programs/{pid}/study-modules/{mid}/edit(pid=${degreeProgram.id},mid=${studyModule.studyModuleKey})}"
                   class="btn btn-sm btn-outline-secondary me-1">
                    <i class="bi bi-pencil"></i>
                </a>
                <form th:action="@{/degree-programs/{pid}/study-modules/{mid}/delete(pid=${degreeProgram.id},mid=${studyModule.studyModuleKey})}"
                      method="post" class="d-inline"
                      onsubmit="return confirm('Delete study module ' + this.dataset.name + '?')"
                      th:attr="data-name=${studyModule.name}">
                    <button type="submit" class="btn btn-sm btn-outline-danger">
                        <i class="bi bi-trash"></i>
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
